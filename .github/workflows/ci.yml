name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: make check
      - run: semantic-metrics --catalog examples/catalog.json validate
      - run: semantic-metrics --catalog examples/catalog.json compile --metric average_order_value --dimension country --grain week --start 2026-01-01 --end 2026-03-01

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag semantic-metrics-demo:${{ github.sha }} .
      - run: docker run --rm semantic-metrics-demo:${{ github.sha }}

